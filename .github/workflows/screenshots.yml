name: Screenshots

# Installs a published test build on an emulator, walks through the main Glow
# screens and publishes the screenshots as a "screens-<tag>" pre-release.
# Started manually (workflow_dispatch) once a test release is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag of the APK, e.g. v1.0.0-test24'
        required: true
      script:
        description: 'Script in .github/scripts to run on the emulator'
        required: false
        default: 'screens.sh'

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      APK_TAG: ${{ github.event.inputs.tag || 'v1.0.0-test25' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        run: gh release download "$APK_TAG" --pattern "Glow-Launcher-$APK_TAG.apk" --output glow.apk
      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/${{ github.event.inputs.script || 'screens.sh' }}
      - name: Publish screenshots
        if: always()
        run: |
          ls -la screens || exit 0
          NAME="screens-$APK_TAG"
          [ "${{ github.event.inputs.script || 'screens.sh' }}" = "screens.sh" ] || NAME="probe-$APK_TAG"
          gh release delete "$NAME" --yes --cleanup-tag || true
          gh release create "$NAME" screens/* --prerelease \
            --target "$GITHUB_SHA" --title "Screenshots of $APK_TAG" \
            --notes "Emulator screenshots (Pixel 6, Android 14) of $APK_TAG."
